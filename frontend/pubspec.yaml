name: tilawati
description: "Tilawati - Aplikasi Pembelajaran dan Evaluasi Bacaan Al-Qur'an Berbasis AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # HTTP & API
  http: ^1.2.2
  
  # Local Storage
  shared_preferences: ^2.3.2
  
  # Audio Recording
  record: ^5.1.2
  audioplayers: ^6.1.0
  
  # UI Components
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.3
  
  # File handling
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
