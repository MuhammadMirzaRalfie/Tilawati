services:
  db:
    image: postgres:16-alpine
    container_name: tilawati_db
    environment:
      POSTGRES_DB: tilawati_db
      POSTGRES_USER: tilawati
      POSTGRES_PASSWORD: tilawati123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilawati -d tilawati_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tilawati:tilawati123@db:5432/tilawati_db
      SECRET_KEY: tilawati-dev-secret-key-2024
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      UPLOAD_DIR: ./uploads
      ASR_SERVICE_URL: ""
      ASR_MODEL_DIR: /models/asr
      CLASSIFICATION_MODEL_DIR: /models/classification
    volumes:
      - ./backend:/app                                                           # source code live reload
      - ../Model/Deploy/api/model:/models/asr:ro
      - ../Model/Model Klasifikasi(Anas-Wav2Vec2)/final-anas-wav2vec2-large-xlsr-arabic:/models/classification:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
